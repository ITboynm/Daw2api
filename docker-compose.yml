version: '3.8'

services:
  daw2api:
    build: .
    container_name: daw2api
    ports:
      - "3000:3000"
    environment:
      # 认证配置（按优先级选择其一）：
      # 最高优先级：固定API密钥（推荐用于生产环境）
      - FACTORY_API_KEY=${FACTORY_API_KEY}
      # 次优先级：refresh token自动刷新机制
      - DROID_REFRESH_KEY=${DROID_REFRESH_KEY}
      # 可选：如果需要修改端口，在config.json中配置
    volumes:
      # 持久化 auth.json 以保存刷新的 tokens
      - ./data:/app/data
      # 持久化本地配置文件（用于保存自定义配置，如代理、密码等）
      # 首次部署前请复制 config.local.json.example 为 config.local.json 并修改
      - ./config.local.json:/app/config.local.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
